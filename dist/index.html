<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>OCHE · Darts Practice</title>
<link rel="stylesheet" href="oche.css">
<script src="oche.js" defer></script>
</head>
<body>
<header><button data-page="home" class="brand" aria-label="OCHE home">◎ OCHE</button><span id="mode-label"></span></header>
<main id="home">
  <p class="eyebrow">DARTS TRAINING</p>
  <h1>At the oche.</h1>
  <button class="card" data-mode="perfect"><strong>PERFECT 501</strong><span>Split bull · 8 rounds · 5 attempts</span></button>
  <button class="card" data-mode="mark"><strong>Bull &amp; Mark</strong><span>13 timed phases · 20 down to 15</span></button>
  <button class="card" data-mode="race"><strong>Bull Race</strong><span>Track bulls and consistency by visit</span></button>
</main>
<main id="history" hidden><h1>History</h1><label>Practice mode <select id="filter"><option value="">All modes</option><option value="perfect">PERFECT 501</option><option value="mark">Bull &amp; Mark</option><option value="race">Bull Race</option></select></label><div id="log"></div></main>
<main id="insights" hidden><h1>Insights</h1><p>Completed sessions on this browser</p><div id="metrics"></div></main>
<main id="settings" hidden>
  <h1>Settings</h1>
  <label>Bull Race target <input id="target-setting" type="number" min="1" max="999" step="1" value="50"></label>
  <label><input id="audio-setting" type="checkbox"> Bull Race sound</label>
  <label><input id="haptics-setting" type="checkbox"> Bull Race vibration</label>
  <p>Settings and history are saved in this browser. Older records on a different website address stay with that address.</p>
  <button id="backup">Download unified history</button>
  <p id="settings-status" role="status"></p>
</main>
<section id="practice" hidden aria-label="Practice"></section>
<nav class="tabs" id="tabs" aria-label="OCHE screens">
  <button data-page="home" aria-current="page">Home</button><button data-page="history">History</button><button data-page="insights">Insights</button><button data-page="settings">Settings</button>
</nav>
</body>
</html>
