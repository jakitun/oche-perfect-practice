<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080909"><title>Oche · Darts Stopwatch</title><link rel="stylesheet" href="style.css"><main>
<header><strong>◎ &nbsp; OCHE</strong><nav aria-label="Screens"><button id="drillTab" aria-pressed="true">Drill</button><button id="historyTab" aria-pressed="false">History</button></nav></header>
<section id="drill"><div class="card"><div id="phaseLabel" class="eyebrow">PHASE 01 / 13</div><div id="progress" aria-hidden="true"></div><h1 id="target" aria-live="polite">Bull</h1><p id="rule">2 bulls</p><div id="split" class="clock">0:00.00</div><p class="eyebrow">SESSION <span id="total">0:00.00</span></p><button id="advance">Start drill</button><p id="next"></p></div><div id="runningTools" hidden><button id="discard" class="quiet">Discard run</button></div><div id="results"></div></section>
<section id="history" hidden><h1>History</h1><p>Completed sessions on this device</p><div id="historyBody"></div></section><p id="status" role="status"></p>
</main><script src="app.js" defer></script></html>
